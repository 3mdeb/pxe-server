---
- name: build rootfs, kernels and prepare chroot
  hosts: localhost
  connection: local
  roles:
    - { role: "common", tags: "rootfs_prepare" }
    - { role: "debootstrap", tags: "rootfs_prepare" }
    - {
        role: "linux-kernel",
        version: "{{ linux_5_15 }}",
        config: "{{ apu_config }}",
        tags: "rootfs_prepare",
      }
    - {
        role: "linux-kernel",
        version: "{{ linux_6_1 }}",
        config: "{{ apu_config }}",
        tags: "rootfs_prepare",
      }
    - {
        role: "linux-kernel",
        version: "{{ linux_6_6 }}",
        config: "{{ apu_config }}",
        tags: "rootfs_prepare",
      }
