- name: check linux_headers
  stat:
    path: "{{ results_dir }}/linux-headers-{{ version }}_{{ version }}-1_amd64.deb"
  register: linux_headers
- name: check linux_image_dbg
  stat:
    path: "{{ results_dir }}/linux-image-{{ version }}-dbg_{{ version }}-1_amd64.deb"
  register: linux_image_dbg
- name: check linux_image
  stat:
    path: "{{ results_dir }}/linux-image-{{ version }}_{{ version }}-1_amd64.deb"
  register: linux_image
- name: check linux_libc
  stat:
    path: "{{ results_dir }}/linux-libc-dev_{{ version }}-1_amd64.deb"
  register: linux_libc
- name: check vmlinuz
  stat:
    path: "{{ results_dir }}/vmlinuz-{{ version }}"
  register: vmlinuz
- name: check config
  stat:
    path: "{{ results_dir }}/config-{{ version }}"
  register: config_ver

- name: Clone or fetch Linux "{{ version }}" branch or checkout tag
  git:
    repo: "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
    dest: "{{ rootfs_dir }}/linux-src"
    version: "{{ 'linux-5.15.y' if version.startswith('5.15') else 'linux-6.1.y' if version.startswith('6.1') else 'linux-6.6.y' }}"
    force: yes
  register: result
  until: result is succeeded
  retries: 3
  delay: 3
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: make mrproper
  command: make mrproper
  args:
    chdir: "{{ rootfs_dir }}/linux-src"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: copy kernel config
  copy:
    src: "{{ configs_dir }}/{{ 'config-5.15.y' if version.startswith('5.15') else 'config-6.1.y' if version.startswith('6.1') else 'config-6.6.y' }}"
    dest: "{{ rootfs_dir }}/linux-src/.config"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: make olddefconfig
  command: make olddefconfig
  args:
    chdir: "{{ rootfs_dir }}/linux-src"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)

- name: make tools
  command: make tools
  args:
    chdir: "{{ rootfs_dir }}/linux-src"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: make deb-pkg
  command: make deb-pkg bzImage
  #command: make deb-pkg bzImage
  args:
    chdir: "{{ rootfs_dir }}/linux-src"
    creates:
      - "{{ rootfs_dir }}/linux-headers-{{ version }}_{{ version }}-1_amd64.deb"
      - "{{ rootfs_dir }}/linux-image-{{ version }}-dbg_{{ version }}-1_amd64.deb"
      - "{{ rootfs_dir }}/linux-image-{{ version }}_{{ version }}-1_amd64.deb"
      - "{{ rootfs_dir }}/linux-libc-dev_{{ version }}-1_amd64.deb"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: copy bzImage to known location
  copy:
    src: "{{ rootfs_dir }}/linux-src/arch/x86/boot/bzImage"
    dest: "{{ results_dir }}/vmlinuz-{{ version }}"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: copy deb to known location
  copy:
    src: "{{ item }}"
    dest: "{{ results_dir }}"
  loop:
    - "{{ rootfs_dir }}/linux-headers-{{ version }}_{{ version }}-1_amd64.deb"
    - "{{ rootfs_dir }}/linux-image-{{ version }}-dbg_{{ version }}-1_amd64.deb"
    - "{{ rootfs_dir }}/linux-image-{{ version }}_{{ version }}-1_amd64.deb"
    - "{{ rootfs_dir }}/linux-libc-dev_{{ version }}-1_amd64.deb"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: make savedefconfig
  command: make savedefconfig
  args:
    chdir: "{{ rootfs_dir }}/linux-src"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: copy defconfig to known location
  copy:
    src: "{{ rootfs_dir }}/linux-src/defconfig"
    dest: "{{ configs_dir }}/{{ 'config-5.15.y' if version.startswith('5.15') else 'config-6.1.y' if version.startswith('6.1') else 'config-6.6.y' }}"
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined

- name: remove everything except artifacts
  file:
    path: "{{ rootfs_dir }}/{{ item }}"
    state: absent
  with_items:
    - linux-{{ version }}
    - linux-{{ version }}.tar.gz
    - linux-{{ version }}_{{ version }}-1_amd64.changes
    - linux-{{ version }}_{{ version }}-1.debian.tar.gz
    - linux-{{ version }}_{{ version }}-1.dsc
    - linux-{{ version }}_{{ version }}.orig.tar.gz
    - linux-headers-{{ version }}_{{ version }}-1_amd64.deb
    - linux-image-{{ version }}-dbg_{{ version }}-1_amd64.deb
    - linux-image-{{ version }}_{{ version }}-1_amd64.deb
    - linux-libc-dev_{{ version }}-1_amd64.deb
  when:
    - not (config_ver.stat.exists and vmlinuz.stat.exists and linux_libc.stat.exists and linux_image.stat.exists and linux_image_dbg.stat.exists and linux_headers.stat.exists)
    - config_ver.stat.exists is defined
    - vmlinuz.stat.exists is defined
    - linux_libc.stat.exists is defined
    - linux_image.stat.exists is defined
    - linux_image_dbg.stat.exists is defined
    - linux_headers.stat.exists is defined
